services:
  postgres:
    image: postgres:16-alpine
    container_name: manufacturing-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: manufacturing_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manufacturing_agent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: manufacturing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  iflow-simulator:
    build:
      context: ../integration-mocks/iflow-simulator
      dockerfile: Dockerfile
    container_name: iflow-simulator
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      SAP_API_KEY: ${SAP_API_KEY:-}
      SAP_SANDBOX_BASE_URL: ${SAP_SANDBOX_BASE_URL:-https://sandbox.api.sap.com/s4hanacloud}
      LEDGER_DIR: /data
      LOG_LEVEL: info
    volumes:
      - ledger_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp-inventory:
    build:
      context: ../mcp-servers/mcp-inventory
      dockerfile: Dockerfile
    container_name: mcp-inventory
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      IFLOW_BASE_URL: ${IFLOW_BASE_URL:-http://iflow-simulator:4000}
      IFLOW_CLIENT_ID: mock-client
      IFLOW_CLIENT_SECRET: mock-secret
      IFLOW_TOKEN_URL: ${IFLOW_TOKEN_URL:-http://iflow-simulator:4000/oauth/token}
      IFLOW_API_KEY: ${IFLOW_API_KEY:-}
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-local-dev-mcp-secret}
      LOG_LEVEL: info
    depends_on:
      iflow-simulator:
        condition: service_healthy

  mcp-warehouse-ops:
    build:
      context: ../mcp-servers/mcp-warehouse-ops
      dockerfile: Dockerfile
    container_name: mcp-warehouse-ops
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      IFLOW_BASE_URL: ${IFLOW_BASE_URL:-http://iflow-simulator:4000}
      IFLOW_CLIENT_ID: mock-client
      IFLOW_CLIENT_SECRET: mock-secret
      IFLOW_TOKEN_URL: ${IFLOW_TOKEN_URL:-http://iflow-simulator:4000/oauth/token}
      IFLOW_API_KEY: ${IFLOW_API_KEY:-}
      REDIS_URL: redis://redis:6379
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-local-dev-mcp-secret}
      LOG_LEVEL: info
    depends_on:
      iflow-simulator:
        condition: service_healthy
      redis:
        condition: service_healthy

  orchestrator:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    container_name: orchestrator
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-prod}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/manufacturing_agent
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 8640000
      IFLOW_BASE_URL: ${IFLOW_BASE_URL:-http://iflow-simulator:4000}
      MCP_SERVERS: '{"inventory":"http://mcp-inventory:4001","warehouse-ops":"http://mcp-warehouse-ops:4002"}'
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-local-dev-mcp-secret}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5000
      LLM_PROVIDER: ${LLM_PROVIDER:-self-hosted}
      SELF_HOSTED_LLM_URL: ${SELF_HOSTED_LLM_URL:-https://api.openai.com/v1}
      SELF_HOSTED_LLM_API_KEY: ${OPENAI_API_KEY:-}
      SELF_HOSTED_MODEL: ${SELF_HOSTED_MODEL:-gpt-4.1-nano}
      SELF_HOSTED_LLM_HTTP_REFERER: ${SELF_HOSTED_LLM_HTTP_REFERER:-}
      SELF_HOSTED_LLM_X_TITLE: ${SELF_HOSTED_LLM_X_TITLE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AZURE_OPENAI_MODEL: gpt-4o-mini
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-inventory:
        condition: service_started
      mcp-warehouse-ops:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_WS_URL: http://localhost:3000
    depends_on:
      orchestrator:
        condition: service_started

  approuter:
    build:
      context: ../approuter
      dockerfile: Dockerfile
    container_name: approuter
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      destinations: '[{"name":"orchestrator","url":"http://orchestrator:3000","forwardAuthToken":true}]'
      xsappname: manufacturing-agent
      AUTH_MODE: mock
    depends_on:
      frontend:
        condition: service_started
      orchestrator:
        condition: service_started

volumes:
  ledger_data:
  pg_data:
  redis_data:
