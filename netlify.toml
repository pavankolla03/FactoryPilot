# FactoryPilot frontend — Netlify (Phase E, beta)
# Set VITE_API_BASE_URL and VITE_WS_URL in the Netlify dashboard to the
# orchestrator's public URL (e.g. https://factorypilot-orchestrator.onrender.com).
[build]
  base = "."
  command = "npm install && npm run build -w @manufacturing-agent/shared && npm run build -w @manufacturing-agent/frontend"
  publish = "frontend/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
