# Serves the built React bundle. The API and WebSocket are NOT proxied here —
# Caddy (or an ALB) sits in front and routes /api and /ws to the orchestrator,
# so the browser only ever talks to one origin and CORS never comes into play.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers pinned to the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Single-page app: unknown paths fall through to index.html so client-side
    # routing works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
